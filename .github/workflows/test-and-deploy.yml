name: tests and deploy

# every push and pull request is tested, in three browser engines and on two phones; a push to main is deployed
# to GitHub Pages only when every one of them passes.
# Needs Settings > Pages > Source: GitHub Actions (instead of "Deploy from a branch")
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.browser }}, ${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.informational == true }}
    strategy:
      # one browser failing still shows how the others did
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, device: desktop }
          - { browser: chromium, device: phone }
          # not run locally yet: they report, but do not stop a deploy until they have passed once
          - { browser: firefox, device: desktop, informational: true }
          - { browser: webkit, device: desktop, informational: true }
          - { browser: webkit, device: phone, informational: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and ${{ matrix.browser }}
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Every command, flag and feature, in a headless browser
        run: node tests/run.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DEVICE: ${{ matrix.device }}

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deploy at a time, and a running one is never cut off halfway
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Only the files the site needs (no tests, README or workflows)
        run: |
          mkdir _site
          cp -r index.html CNAME sw.js manifest.webmanifest css js icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
