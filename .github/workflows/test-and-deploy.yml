name: tests and deploy

# every push and pull request is tested, in three browser engines and on two phones; a push to main is deployed
# to GitHub Pages only when every one of them passes. Each browser runs in two shards side by side: the
# achievements (the slow part) and everything else. A failed shard keeps a screenshot and the terminal text.
# Needs Settings > Pages > Source: GitHub Actions (instead of "Deploy from a branch")
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the test matrix before deploy
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.target.browser }}, ${{ matrix.target.device }}, ${{ matrix.shard }})
    if: github.event_name != 'workflow_dispatch' || inputs.run_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.target.informational == true }}
    strategy:
      # one browser failing still shows how the others did
      fail-fast: false
      matrix:
        target:
          - { browser: chromium, device: desktop }
          - { browser: chromium, device: phone }
          # not run locally yet: they report, but do not stop a deploy until they have passed once
          - { browser: firefox, device: desktop, informational: true }
          - { browser: webkit, device: desktop, informational: true }
          - { browser: webkit, device: phone, informational: true }
        shard: [main, achievements]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the browser itself comes from the cache after the first run; the system libraries it needs do not
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-${{ matrix.target.browser }}
      - name: Install Playwright and ${{ matrix.target.browser }}
        run: |
          npm install --no-save playwright@1.49.1
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps ${{ matrix.target.browser }}
          else
            npx playwright install --with-deps ${{ matrix.target.browser }}
          fi
      - name: Every command, flag and feature, in a headless browser (${{ matrix.shard }})
        run: node tests/run.mjs
        env:
          BROWSER: ${{ matrix.target.browser }}
          DEVICE: ${{ matrix.target.device }}
          SHARD: ${{ matrix.shard }}
      - name: Keep the screenshot and terminal text of what failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target.browser }}-${{ matrix.target.device }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: test
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.run_tests == false || needs.test.result == 'success')) ||
        (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.test.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deploy at a time, and a running one is never cut off halfway
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Only the files the site needs (no tests, design, README or workflows)
        run: |
          mkdir _site
          cp -r index.html CNAME sw.js manifest.webmanifest css js icons fonts _site/
      # a cache of its own for every deploy: the service worker installs fresh and throws the old one away
      - name: Stamp the service worker cache with this commit
        run: sed -i "s/const CACHE = 'terminal-dev'/const CACHE = 'terminal-${GITHUB_SHA::7}'/" _site/sw.js && grep -q "terminal-${GITHUB_SHA::7}" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
