function resolve(p) {
  let segs;
  if (!p) p = '.';
  if (p === '~') segs = [];
  else if (p.startsWith('~/')) segs = p.slice(2).split('/');
  else if (p.startsWith('/home/guest')) segs = p.slice(11).split('/');
  else if (p.startsWith('/')) return { error: 'root' };
  else segs = [...cwd, ...p.split('/')];
  const stack = [];
  let escaped = false;
  for (const s of segs) {
    if (!s || s === '.') continue;
    if (s === '..') { if (!stack.length) escaped = true; stack.pop(); continue; }
    stack.push(s);
  }
  let node = FS;
  for (const s of stack) {
    if (node.type !== 'dir' || !node.children[s]) return { error: 'missing', segs: stack };
    node = node.children[s];
  }
  return { node, segs: stack, escaped };
}

function lsEntry(name, node, segs) {
  const path = '~/' + [...segs, name].join('/');
  if (node.type === 'dir') return `<a class="dir" data-cmd="cd ${esc(path)}">${esc(name)}/</a>`;
  return `<a class="file" data-cmd="cat ${esc(path)}">${esc(name)}</a>`;
}

// live articles from RSS
async function refreshFeed() {
  try {
    const res = await fetch(PROFILE.rss, { cache: 'no-store', signal: AbortSignal.timeout(4000) });
    if (!res.ok) throw 0;
    const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
    const entries = [...xml.querySelectorAll('entry')];
    if (!entries.length) throw 0;
    let added = 0;
    for (const e of entries) {
      const href = e.querySelector('link')?.getAttribute('href') || '';
      const path = href.replace(/^https?:\/\/[^/]+/, '');
      if (!path || POSTS.some(p => p.url === path)) continue;
      const title = (e.querySelector('title')?.textContent || '').trim();
      const emoji = title.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);
      const cats = [...e.querySelectorAll('category')].map(c => c.getAttribute('term') || '').join(' ');
      const p = {
        date: (e.querySelector('published')?.textContent || '').slice(0, 10),
        type: /guide/i.test(cats) ? 'guide' : 'project', icon: emoji ? emoji[1] : '📝',
        title: emoji ? title.slice(emoji[0].length) : title,
        url: path,
        desc: (e.querySelector('summary')?.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 220),
      };
      p.file = slugify(p.title) + '.md';
      POSTS.push(p); added++;
      (p.type === 'guide' ? FS.children.articles : FS.children.projects).children[p.file] = { type:'file', read: () => fmtPost(p) };
    }
    POSTS.sort((a, b) => b.date.localeCompare(a.date));
    POSTS.forEach((p, i) => p.n = i + 1);
    return added;
  } catch { return -1; }
}

function parseUA() {
  const u = navigator.userAgent;
  const browsers = [['Edge', /Edg(?:iOS|A)?\/(\d+)/], ['Opera', /OPR\/(\d+)/], ['Samsung Internet', /SamsungBrowser\/(\d+)/],
    ['Firefox', /(?:Firefox|FxiOS)\/(\d+)/], ['Chrome', /(?:Chrome|CriOS)\/(\d+)/], ['Safari', /Version\/(\d+).*Safari/]];
  const oses = [['iOS', /iPhone|iPod/], ['iPadOS', /iPad/], ['Android', /Android/], ['Windows', /Windows/],
    ['ChromeOS', /CrOS/], ['macOS', /Mac OS X/], ['Linux', /Linux/]];
  let browser = 'Unknown', os = 'Unknown';
  for (const [n, re] of browsers) { const m = re.exec(u); if (m) { browser = `${n} ${m[1]}`; break; } }
  for (const [n, re] of oses) if (re.test(u)) { os = n; break; }
  if (os === 'macOS' && navigator.maxTouchPoints > 1) os = 'iPadOS';
  const device = /Mobi/.test(u) ? 'mobile' : navigator.maxTouchPoints > 0 ? 'touch device' : 'desktop';
  return { browser, os, device };
}

const hashOf = str => [...str].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function lsLong(name, node) {
  const h = hashOf(name), dir = node.type === 'dir', hidden = name.startsWith('.') && name.length > 2;
  const post = POSTS.find(p => p.file === name);
  const d = post ? new Date(post.date) : new Date(Date.now() - (h % 300 + 1) * 864e5);
  const perm = dir ? (hidden ? 'drwx------' : 'drwxr-xr-x') : (hidden ? '-rw-------' : '-rw-r--r--');
  const links = dir ? 2 + Object.values(node.children).filter(c => c.type === 'dir').length : 1;
  const size = dir ? 4096 : 200 + (h % 3800);
  const date = `${d.toLocaleString('en', { month: 'short' })} ${String(d.getDate()).padStart(2)}  ${d.getFullYear()}`;
  return span('m', `${perm} ${String(links).padStart(2)} ian guest ${String(size).padStart(5)} ${date}`) + ' ';
}

def(['ls', 'dir', 'll'], 'nav', 'list files', (args, raw = '') => {
  // ll is ls -al, like on most Linux boxes
  const flags = args.filter(a => /^-\w/.test(a)).join('') + (/^\s*ll\b/.test(raw) ? 'al' : '');
  const all = flags.includes('a'), long = flags.includes('l');
  const target = args.find(a => !a.startsWith('-'));
  const r = resolve(target);
  if (r.error === 'root') return print(span('e', `ls: cannot open directory '${esc(target)}': Permission denied`));
  if (r.error) return print(span('e', `ls: cannot access '${esc(target)}': No such file or directory`));
  if (r.node.type === 'file') return print((long ? lsLong(r.segs.at(-1), r.node) : '') + lsEntry(r.segs.at(-1), r.node, r.segs.slice(0, -1)));
  const entries = Object.entries(r.node.children).filter(([n]) => all || !n.startsWith('.'))
    .sort(([a, x], [b, y]) => (x.type === y.type ? a.localeCompare(b) : x.type === 'dir' ? -1 : 1));
  if (long) {
    print(span('m', `total ${(entries.length + (all ? 2 : 0)) * 4}`));
    if (all) {
      print(lsLong('.', r.node) + `<a class="dir" data-cmd="cd .">./</a>`);
      print(lsLong('..', r.node) + `<a class="dir" data-cmd="cd ..">../</a>`);
    }
    return entries.forEach(([n, node]) => print(lsLong(n, node) + lsEntry(n, node, r.segs)));
  }
  if (all) print(`<a class="dir" data-cmd="cd .">./</a>  <a class="dir" data-cmd="cd ..">../</a>`);
  print(entries.map(([n, node]) => lsEntry(n, node, r.segs)).join('  ') || span('m', '(empty)'));

// tiny 8-bit synth; browsers only allow sound after a key press or click, which a typed command is
let audio;
let soundOn = store.get('sound', true);
function tone(freq, at, dur, type = 'square', vol = 0.05) {
  if (!soundOn) return;
  audio ||= new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}
// startup sound: power thump, fan spin-up, POST beep, disk clicks per boot line, a chord at the end.
// Browsers block sound until the visitor clicks or types, so a fresh visit plays it on the first interaction.
function sweep(f0, f1, at, dur, type = 'sawtooth', vol = 0.03) {
  if (!soundOn) return;
  audio ||= new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(at, dur, vol = 0.03, freq = 1000, q = 1) {
  if (!soundOn) return;
  audio ||= new (window.AudioContext || window.webkitAudioContext)();
  const len = Math.ceil(audio.sampleRate * dur), buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain(), t = audio.currentTime + at;
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.05, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(audio.destination); src.start(t); src.stop(t + dur + 0.02);
}
const powerOn = () => {
  sweep(140, 45, 0, 0.3, 'sine', 0.12);          // relay thump
  noise(0.05, 2.2, 0.025, 450, 0.6);            // fan spinning up
  sweep(70, 210, 0.05, 1.8, 'sawtooth', 0.008); // motor whine
  tone(1000, 0.7, 0.14, 'square', 0.04);        // POST beep
};

const chime = at => {

  [261.6, 329.6, 392].forEach(f => tone(f, at + 0.05, 1.3, 'sine', 0.025));      // soft pad
  [523, 659, 784, 1047].forEach((f, i) => tone(f, at + i * 0.09, 0.35, 'triangle', 0.06));

  if (!allowed || (audio && audio.state !== 'running')) {
    if (stage === 'done' && !bootSoundArmed) {
      bootSoundArmed = true;
      const t0 = Date.now();
      const first = () => {
        removeEventListener('pointerdown', first, true); removeEventListener('keydown', first, true);
        if (Date.now() - t0 > 15000) return;
        try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume().then(() => { powerOn(); [1.0, 1.4, 1.8, 2.2].forEach(t => noise(t, 0.03, 0.05, 3200, 2)); chime(2.6); }).catch(() => {}); } catch {}
      };
      addEventListener('pointerdown', first, true); addEventListener('keydown', first, true);
    }
    return;
  }
  try {
    if (stage === 'start') { powerOn(); bootSound.t = audio.currentTime; }
    if (stage === 'tick') diskClick();
    // the chord comes after the POST beep, even when a returning visitor skips the boot lines
    if (stage === 'done') chime(Math.max(0, (bootSound.t ?? audio.currentTime) + 1.0 - audio.currentTime));
    if (stage === 'down') powerDown();
  } catch {}
}

def('snake', 'fun', 'play snake (arrows / WASD / swipe)', () => new Promise(resolve => {
  if (capture) return resolve(print(span('e', 'snake: needs a real screen, not a pipe')));
  const W = 20, H = 12, hi = store.get('snakeHi', 0);
  let snake = [[6, 6], [5, 6], [4, 6]], dir = [1, 0], next = [1, 0], food, score = 0, speed = 150, timer;
  const box = print('');
  const same = (a, b) => a[0] === b[0] && a[1] === b[1];
  const place = () => { do food = [Math.floor(Math.random() * W), Math.floor(Math.random() * H)]; while (snake.some(c => same(c, food))); };
  const draw = () => {
    const rows = [span('m', '+' + '-'.repeat(W * 2) + '+')];
    for (let y = 0; y < H; y++) {
      let r = span('m', '|');
      for (let x = 0; x < W; x++) {
        const c = [x, y];
        // coloured spaces keep every cell exactly two characters wide in any font
        r += same(c, snake[0]) ? '<span style="background:var(--accent)">  </span>' : snake.some(s => same(s, c)) ? '<span style="background:var(--accent);opacity:.55">  </span>' : same(c, food) ? span('w b', '<>') : '  ';
      }
      rows.push(r + span('m', '|'));
    }
    rows.push(span('m', '+' + '-'.repeat(W * 2) + '+'));
    rows.push(`score ${span('w b', score)}   best ${Math.max(hi, score)}   ${span('m', 'arrows / WASD / swipe · q quits')}`);
    box.innerHTML = rows.join('\n');
    scrollDown();
  };
  const step = () => {
    dir = next;
    const h = [snake[0][0] + dir[0], snake[0][1] + dir[1]];
    if (h[0] < 0 || h[1] < 0 || h[0] >= W || h[1] >= H || snake.some(c => same(c, h))) return end(false);
    snake.unshift(h);
    if (same(h, food)) { score++; place(); speed = Math.max(70, speed - 5); clearInterval(timer); timer = setInterval(step, speed); }
    else snake.pop();
    draw();
  };
  const turn = (dx, dy) => { if (dx !== -dir[0] || dy !== -dir[1]) next = [dx, dy]; };
  const KEYS = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  const onKey = e => {
    e.stopPropagation();
    const k = e.key.toLowerCase();
    if (KEYS[k]) { e.preventDefault(); turn(...KEYS[k]); }
    else if (k === 'q' || k === 'escape' || (e.ctrlKey && k === 'c')) { e.preventDefault(); end(true); }
  };
  let t0 = null;
  const onTouchStart = e => { t0 = [e.touches[0].clientX, e.touches[0].clientY]; };
  const onTouchEnd = e => {
    if (!t0) return;
    const dx = e.changedTouches[0].clientX - t0[0], dy = e.changedTouches[0].clientY - t0[1];
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 25) Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
    t0 = null;
  };
  function end(quit) {
    clearInterval(timer);
    removeEventListener('keydown', onKey, true);
    removeEventListener('touchstart', onTouchStart);
    removeEventListener('touchend', onTouchEnd);
    if (score > hi) store.set('snakeHi', score);
    print(quit ? span('m', `You put the snake away. Score: ${score}`) : span('e', `Game over! Score: ${score}`) + (score > hi && hi ? span('w b', '  new high score!') : ''));
    if (score >= 10) unlock('snake');
    resolve();
  }
  addEventListener('keydown', onKey, true);
  addEventListener('touchstart', onTouchStart, { passive: true });
  addEventListener('touchend', onTouchEnd, { passive: true });
  place(); draw();
  timer = setInterval(step, speed);
}));

function tokenize(s) {
  const out = []; let cur = '', q = null;
  for (const ch of s) {
    if (q) { if (ch === q) q = null; else cur += ch; }
    else if (ch === '"' || ch === "'") q = ch;
    else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ''; } }
    else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

async function execLine(line) {

  return c.run(args, line);
}

// split on a separator outside quotes; seps are tried in order, so '&&' wins over '&'
function splitOutside(str, seps) {
  const parts = []; let cur = '', q = null, op = null;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (q) { if (ch === q) q = null; cur += ch; continue; }
    if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
    const sep = seps.find(sp => str.startsWith(sp, i) && !(sp === '|' && str[i + 1] === '|'));
    if (sep) { parts.push({ op, text: cur.trim() }); cur = ''; op = sep; i += sep.length - 1; continue; }
    cur += ch;
  }
  parts.push({ op, text: cur.trim() });
  return parts.filter(p => p.text);
}

let aliases = store.get('aliases', {});

  const name = line.split(/\s+/)[0];

};

async function execOne(line) {
  const [name, ...args] = tokenize(line);
  if (!name) return;
  const c = C[name.toLowerCase()];
  if (!c) {
    const visible = Object.values(C).filter(x => x.group && !x.alias).map(x => x.name);
    const best = visible.map(n => [n, lev(name.toLowerCase(), n)]).sort((a, b) => a[1] - b[1])[0];
    return print(span('e', `command not found: ${esc(name)}`) + (best && best[1] <= 2 ? span('m', ' - did you mean ') + cmd(best[0]) + span('m', '?') : span('m', ' - type ') + cmd('help')));
  }
  return c.run(args, line);
}

function htmlToText(lines) {
  const d = document.createElement('div');
  return lines.flatMap(html => {

}

// commands that read from a pipe
const FILTERS = {
  grep(args, lines) {
    const flags = args.filter(a => a.startsWith('-')).join('');
    const pat = args.find(a => !a.startsWith('-'));
    if (!pat) return [span('e', 'usage: ... | grep [-i] [-v] <pattern>')];
    let re;
    // smart case: lowercase patterns ignore case, any capital makes it exact (like ripgrep --smart-case)
    const ci = flags.includes('i') || pat === pat.toLowerCase();
    try { re = new RegExp(pat, ci ? 'gi' : 'g'); } catch { re = new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); }
    const hit = l => { re.lastIndex = 0; return re.test(l); };
    const keep = lines.filter(l => hit(l) !== flags.includes('v'));
    if (!keep.length) { failed = true; return []; }
    return keep.map(l => flags.includes('v') ? esc(l) : l.split(re).map(esc).reduce((acc, part, i, arr) => acc + part + (i < arr.length - 1 ? span('w b', esc(l.match(re)[i])) : ''), ''));
  },
  head(args, lines) { const n = parseInt((args.join(' ').match(/\d+/) || [10])[0], 10); return lines.slice(0, n).map(esc); },
  tail(args, lines) { const n = parseInt((args.join(' ').match(/\d+/) || [10])[0], 10); return lines.slice(-n).map(esc); },
  wc(args, lines) {
    const words = lines.join(' ').split(/\s+/).filter(Boolean).length, chars = lines.join('\n').length;
    if (args.includes('-l')) return [String(lines.length)];
    if (args.includes('-w')) return [String(words)];
    return [`${String(lines.length).padStart(7)} ${String(words).padStart(7)} ${String(chars).padStart(7)}`];
  },
  sort(args, lines) { const out = [...lines].sort((a, b) => a.localeCompare(b)); return (args.includes('-r') ? out.reverse() : out).map(esc); },
  uniq(args, lines) { return lines.filter((l, i) => l !== lines[i - 1]).map(esc); },
  lolcat(args, lines) { return lines.map(rainbow); },
};

async function execPipeline(line) {
  const stages = splitOutside(line, ['|']).map(p => p.text);
  if (stages.length === 1) return execOne(stages[0]);
  unlock('pipe');
  const prev = capture; capture = [];
  let html;
  try { await execOne(stages[0]); } finally { html = capture; capture = prev; }
  let lines = htmlToText(html).filter((l, i, a) => l.trim() || (i > 0 && i < a.length - 1));
  for (let i = 1; i < stages.length; i++) {
    const [name, ...args] = tokenize(stages[i]);
    const f = FILTERS[(name || '').toLowerCase()];
    const last = i === stages.length - 1;
    if (f) {
      const outLines = f(args, lines);
      if (last) return printLines(outLines);
      lines = htmlToText(outLines);
    } else {
      // anything else gets the piped text as arguments: fortune | cowsay, echo hi | rot13
      const next = `${stages[i]} ${lines.join(' ').replace(/\s+/g, ' ').trim()}`;
      if (last) return execOne(next);
      const p2 = capture; capture = [];
      try { await execOne(next); } finally { html = capture; capture = p2; }
      lines = htmlToText(html);
    }
  }
}

async function execChain(raw, depth = 0) {
  for (const part of splitOutside(raw, ['&&', ';'])) {
    if (part.op === '&&' && failed) continue;
    failed = false;
    const text = expandAlias(part.text);
    if (text !== part.text && depth < 3 && /;|&&/.test(text)) await execChain(text, depth + 1);
    else await execPipeline(text);
  }
}

// tab completion, pressing tab again cycles through the matches
let cycle = null;
function complete(back = false) {
  if (cycle && kb.value === cycle.current) {
    const n = cycle.opts.length;
    cycle.idx = cycle.idx < 0 ? (back ? n - 1 : 0) : (cycle.idx + (back ? -1 : 1) + n) % n;
    const o = cycle.opts[cycle.idx];
    kb.value = cycle.current = cycle.head + o + (o.endsWith('/') ? '' : cycle.suffix);
    cycle.items.forEach((el, i) => el.classList.toggle('sel', i === cycle.idx));
    moveEnd();
    return;
  }
  cycle = null;
  const val = kb.value, parts = val.split(/\s+/);
  if (parts.length === 1) {
    const opts = Object.values(C).filter(c => c.group && !c.alias).map(c => c.name).filter(n => n.startsWith(parts[0]));
    return applyCompletion(val, parts[0], opts, ' ');
  }
  const word = parts.at(-1);
  const slash = word.lastIndexOf('/');
  const dirPart = slash >= 0 ? word.slice(0, slash + 1) : '';
  const base = word.slice(slash + 1);
  const r = resolve(dirPart || '.');
  if (r.error || r.node.type !== 'dir') return;
  const opts = Object.entries(r.node.children)
    .filter(([n]) => n.startsWith(base) && (base.startsWith('.') || !n.startsWith('.')))
    .map(([n, node]) => dirPart + n + (node.type === 'dir' ? '/' : ''));
  applyCompletion(val, word, opts, '');
}
function applyCompletion(val, word, opts, suffix) {
  if (!opts.length) return;
  opts = [...new Set(opts)].sort((a, b) => a.localeCompare(b));
  const head = val.slice(0, val.length - word.length);
  if (opts.length === 1) { kb.value = head + opts[0] + (opts[0].endsWith('/') ? '' : suffix); return; }
  let pre = opts[0];
  for (const o of opts) while (!o.startsWith(pre)) pre = pre.slice(0, -1);
  if (pre.length > word.length) kb.value = head + pre;
  print(promptHTML() + esc(kb.value));
  const label = o => o.slice(o.lastIndexOf('/', o.length - 2) + 1);
  const list = print(opts.map(o => `<span class="opt">${esc(label(o))}</span>`).join('  '));
  cycle = { opts, head, suffix, idx: -1, current: kb.value, items: [...list.querySelectorAll('.opt')] };
}

    if (!fast) { print(span('m', 'IanOS is starting...')); await sleep(900); }
    if (!fast) for (const l of lines) { bootSound('tick'); print(l.replace('OK', span('a', 'OK')).replace(/^\[/, span('m','[')).replace(/^(<span class="m">\[<\/span>.*?)\]/, '$1' + span('m',']'))); await sleep(380); }
    if (!fast) await sleep(250);
  } catch {}
  const nightOwl = new Date().getHours() < 6;
  if (nightOwl) print(span('m', '[') + span('w', ' WARN ') + span('m', ']') + ' Night owl detected, brewing extra coffee');
  if (!fast) print('');
  banner();
  bootSound('done');
  print('');
  print(`Welcome! Type ${cmd('help')} or click one of the commands to get started.`);
  print(`Try: ${cmd('about')}  ${cmd('experience')}  ${cmd('projects')}  ${cmd('articles')}  ${cmd('skills')}  ${cmd('contact')}  ${cmd('ls')}`);
  print(span('m', 'Source code: ') + link(PROFILE.repo) + span('m', ' (') + cmd('repo') + span('m', ')'));
  const sn = season();
  if (sn) print(span('w', sn.msg));
  if (sn && sn.theme && document.body.dataset.theme === 'default') document.body.dataset.theme = sn.theme;
  if (unlocked.size) print(span('m', `Welcome back - you've found ${unlocked.size}/${Object.keys(ACH).length} `) + cmd('achievements') + span('m', '.'));
  print('');
  store.set('visited', true);
  if (nightOwl) unlock('nightowl');
  busy = false; inrow.style.visibility = ''; renderPrompt(); focusInput();
}

document.body.dataset.theme = store.get('theme', 'default');
if (store.get('crt', false)) document.body.classList.add('crt');
feedReady = refreshFeed();
boot().then(() => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) { unlock('deeplink'); run(h.replace(/[-_+]/g, ' ')); }
});
})();
</script>
