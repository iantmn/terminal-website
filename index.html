function relatedLines(at) {
  const rel = at ? POSTS.filter(p => p.at === at) : [];
  if (!rel.length) return [];
  const stack = [...new Set(rel.flatMap(p => p.stack || []))];
  return [
    '', h2('Write-ups from this time'),
    ...rel.map(p => `  ${span('m', p.date.slice(0, 7))}  ${p.icon} <a class="cmd" data-cmd="read ${p.n}">${esc(p.title)}</a>`),
    '', h2('Tools & techniques'), tags(stack),
  ];
}

const fmtExp = e => [

  '',
  esc(e.text),

const fmtEdu = e => [

  `${span('h', esc(e.org))} ${span('m', '- ' + esc(e.place) + ' · ' + esc(e.year))}`,

function fmtPost(p) {
  const guide = p.type === 'guide';
  const origin = p.at && [...EXPERIENCE, ...EDUCATION].find(x => x.at === p.at);
  const l = [
    `${span('a b', '# ' + p.icon + ' ' + esc(p.title))}`,
    span('m', `${p.date} · ${guide ? 'Guide' : 'Project'}${origin ? ' · ' + esc(origin.org) : ''}`),
    '',
  ];
  if (p.context) l.push(h2(guide ? 'Why' : 'The problem'), esc(p.context), '');
  l.push(h2(guide ? 'What it covers' : 'What I built'), esc(p.built || p.desc), '');
  if (p.points && p.points.length) l.push(h2('Highlights'), ...p.points.map(bullet), '');
  if (p.stack && p.stack.length) l.push(h2('Stack'), tags(p.stack), '');
  l.push(`→ ${link(absUrl(p.url), 'read the full ' + (guide ? 'article' : 'write-up'))}  ${span('m','or type')} ${cmd('open ' + p.n)}`);
  return l;
}

function buildFS() {
  const dir = o => ({ type:'dir', children:o });
  const file = fn => ({ type:'file', read:fn });
  const exp = {}, edu = {}, arts = {}, projs = {};
  EXPERIENCE.forEach(e => exp[e.slug + '.md'] = file(() => fmtExp(e)));
  EDUCATION.forEach(e => edu[e.slug + '.md'] = file(() => fmtEdu(e)));
  POSTS.forEach(p => (p.type === 'guide' ? arts : projs)[p.file] = file(() => fmtPost(p)));
  return dir({
    'about.txt':   file(() => ABOUT.map(esc)),
    'contact.txt': file(() => contactLines()),
    'skills.txt':  file(() => skillLines()),
    'cv.txt':      file(cvLines),
    'experience':  dir(exp),
    'education':   dir(edu),
    'articles':    dir(arts),
    'projects':    dir(projs),
  });
}
const FS = buildFS();


function resolve(p) {
  let segs;
  if (!p) p = '.';
  if (p === '~') segs = [];
  else if (p.startsWith('~/')) segs = p.slice(2).split('/');
  else if (p.startsWith('/home/guest')) segs = p.slice(11).split('/');
  else if (p.startsWith('/')) return { error: 'root' };
  else segs = [...cwd, ...p.split('/')];
  const stack = [];
  for (const s of segs) {
    if (!s || s === '.') continue;
    if (s === '..') { stack.pop(); continue; }
    stack.push(s);
  }
  let node = FS;
  for (const s of stack) {
    if (node.type !== 'dir' || !node.children[s]) return { error: 'missing', segs: stack };
    node = node.children[s];
  }
  return { node, segs: stack };
}

function lsEntry(name, node, segs) {
  const path = '~/' + [...segs, name].join('/');
  if (node.type === 'dir') return `<a class="dir" data-cmd="cd ${esc(path)}">${esc(name)}/</a>`;
  return `<a class="file" data-cmd="cat ${esc(path)}">${esc(name)}</a>`;
}

// live articles from RSS
async function refreshFeed() {
  try {
    const res = await fetch(PROFILE.rss, { cache: 'no-store' });
    if (!res.ok) throw 0;
    const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
    const entries = [...xml.querySelectorAll('entry')];
    if (!entries.length) throw 0;
    let added = 0;
    for (const e of entries) {
      const href = e.querySelector('link')?.getAttribute('href') || '';
      const path = href.replace(/^https?:\/\/[^/]+/, '');
      if (!path || POSTS.some(p => p.url === path)) continue;
      const title = (e.querySelector('title')?.textContent || '').trim();
      const cats = [...e.querySelectorAll('category')].map(c => c.getAttribute('term') || '').join(' ');
      const p = {
        date: (e.querySelector('published')?.textContent || '').slice(0, 10),
        type: /guide/i.test(cats) ? 'guide' : 'project', icon: '📝',
        title: title.replace(/^\p{Extended_Pictographic}\s*/u, ''),
        url: path,
        desc: (e.querySelector('summary')?.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 220),
      };
      p.file = slugify(p.title) + '.md';
      POSTS.push(p); added++;
      (p.type === 'guide' ? FS.children.articles : FS.children.projects).children[p.file] = { type:'file', read: () => fmtPost(p) };
    }
    POSTS.sort((a, b) => b.date.localeCompare(a.date));
    POSTS.forEach((p, i) => p.n = i + 1);
    return added;
  } catch { return -1; }
}

function parseUA() {
  const u = navigator.userAgent;
  const browsers = [['Edge', /Edg(?:iOS|A)?\/(\d+)/], ['Opera', /OPR\/(\d+)/], ['Samsung Internet', /SamsungBrowser\/(\d+)/],
    ['Firefox', /(?:Firefox|FxiOS)\/(\d+)/], ['Chrome', /(?:Chrome|CriOS)\/(\d+)/], ['Safari', /Version\/(\d+).*Safari/]];
  const oses = [['iOS', /iPhone|iPod/], ['iPadOS', /iPad/], ['Android', /Android/], ['Windows', /Windows/],
    ['ChromeOS', /CrOS/], ['macOS', /Mac OS X/], ['Linux', /Linux/]];
  let browser = 'Unknown', os = 'Unknown';
  for (const [n, re] of browsers) { const m = re.exec(u); if (m) { browser = `${n} ${m[1]}`; break; } }
  for (const [n, re] of oses) if (re.test(u)) { os = n; break; }
  if (os === 'macOS' && navigator.maxTouchPoints > 1) os = 'iPadOS';
  const device = /Mobi/.test(u) ? 'mobile' : navigator.maxTouchPoints > 0 ? 'touch device' : 'desktop';
  return { browser, os, device };
}

async function fetchWhoami() {
  if (!PROFILE.whoamiApi) return null;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 2500);
  try {
    const res = await fetch(PROFILE.whoamiApi, { cache: 'no-store', signal: ctl.signal });
    if (!res.ok) return null;
    const data = await res.json();
    return data && data.headers ? data : null;
  } catch { return null; } finally { clearTimeout(t); }
}

def('whoami', 'me', 'what I can see about you', async args => {
 
  const all = args.includes('-a') || args.includes('--all');
  const ua = parseUA(), conn = navigator.connection;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const off = -new Date().getTimezoneOffset();
  const utc = `UTC${off >= 0 ? '+' : '-'}${String(Math.floor(Math.abs(off) / 60)).padStart(2, '0')}:${String(Math.abs(off) % 60).padStart(2, '0')}`;

  print(span('u', 'guest') + span('m', ', this is what your browser tells me:'));
  print('');
  print(span('w b', 'Your browser'));
  print(kv([
    ['Browser', ua.browser],
    ['OS', `${ua.os} (${ua.device})`],
    ['Languages', (navigator.languages || [navigator.language]).join(', ')],
    ['Timezone', `${tz} (${utc})`],
    ['Local time', new Date().toLocaleString()],
    ['Screen', `${screen.width}×${screen.height} @${devicePixelRatio}x · window ${innerWidth}×${innerHeight}`],
    ['Colour scheme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'],
    navigator.hardwareConcurrency ? ['CPU cores', String(navigator.hardwareConcurrency)] : null,
    navigator.deviceMemory ? ['Memory', `≥ ${navigator.deviceMemory} GB`] : null,
    conn && conn.effectiveType ? ['Network', conn.effectiveType + (conn.downlink ? ` · ~${conn.downlink} Mbps` : '')] : null,
    ['Do Not Track', navigator.doNotTrack === '1' || navigator.globalPrivacyControl ? 'on' : 'off'],
    ['Referrer', document.referrer || '(direct visit)'],
  ].filter(Boolean)));

  print('');
  const wait = print(span('m', 'asking the server what your request looked like...'));
  const data = await fetchWhoami();
  if (!data) {
    wait.innerHTML = span('m', '(server-side header echo is not available right now)');
  } else {
    wait.remove();
    const h = {};
    for (const [k, v] of Object.entries(data.headers)) h[k.toLowerCase()] = [].concat(v).join(', ');
    const ip = h['cf-connecting-ip'] || h['x-real-ip'] || (h['x-forwarded-for'] || '').split(',')[0].trim()
      || String(data.remoteAddr || '').replace(/:\d+$/, '');
    print(span('w b', 'As seen by the server'));
    print(kv([
      ip ? ['IP address', ip] : null,
      h['x-forwarded-proto'] ? ['Protocol', h['x-forwarded-proto'].toUpperCase()] : null,
      data.method ? ['Request', `${data.method} ${data.host || location.host}`] : null,
    ].filter(Boolean)));
    print('');
    const interesting = ['user-agent', 'accept-language', 'accept-encoding', 'accept', 'sec-ch-ua', 'sec-ch-ua-platform',
      'sec-ch-ua-mobile', 'dnt', 'sec-gpc', 'referer'];
    const keys = all ? Object.keys(h).sort() : interesting.filter(k => h[k]);
    const secret = k => /^(cookie|authorization|proxy-authorization)$/.test(k);
    print(span('w b', 'Request headers'));
    print(kv(keys.map(k => [k, secret(k) ? '[redacted]' : h[k]])));
    if (!all && Object.keys(h).length > keys.length)
      print(span('m', `showing ${keys.length} of ${Object.keys(h).length} headers - `) + cmd('whoami -a', 'show all'));
  }
  print('');
  print(span('m', 'Nothing gets stored. Your browser sends all of this with every request anyway.'));
  print(span('m', `And me? I'm Ian → `) + cmd('about'));
}, { usage: '[-a]' });

def(['ls', 'dir', 'll'], 'nav', 'list files', args => {
  const all = args.some(a => /^-\w*a/.test(a)) || false;
  const target = args.find(a => !a.startsWith('-'));
  const r = resolve(target);
  if (r.error === 'root') return print(span('e', `ls: cannot open directory '${esc(target)}': Permission denied`));
  if (r.error) return print(span('e', `ls: cannot access '${esc(target)}': No such file or directory`));
  if (r.node.type === 'file') return print(lsEntry(r.segs.at(-1), r.node, r.segs.slice(0, -1)));
  const entries = Object.entries(r.node.children).filter(([n]) => all || !n.startsWith('.'))
    .sort(([a, x], [b, y]) => (x.type === y.type ? a.localeCompare(b) : x.type === 'dir' ? -1 : 1));
  if (all) print(`<a class="dir" data-cmd="cd .">./</a>  <a class="dir" data-cmd="cd ..">../</a>`);
  print(entries.map(([n, node]) => lsEntry(n, node, r.segs)).join('  ') || span('m', '(empty)'));
}, { usage: '[-a] [dir]' });

def('cd', 'nav', 'change directory', args => {
  const r = resolve(args[0] || '~');
  if (r.error === 'root') return print(span('e', `cd: ${esc(args[0])}: Permission denied`));
  if (r.error) return print(span('e', `cd: no such file or directory: ${esc(args[0])}`));
  if (r.node.type !== 'dir') return print(span('e', `cd: not a directory: ${esc(args[0])}`));
  cwd = r.segs; renderPrompt();
}, { usage: '<dir>' });

def(['cat', 'less', 'more', 'bat'], 'nav', 'print a file', args => {
  if (!args.length) return print(span('e', 'usage: cat <file>'));
  for (const a of args) {
    const r = resolve(a);
    if (r.error === 'root') { print(span('e', `cat: ${esc(a)}: Permission denied`)); continue; }
    if (r.error) { print(span('e', `cat: ${esc(a)}: No such file or directory`)); continue; }
    if (r.node.type === 'dir') { print(span('e', `cat: ${esc(a)}: Is a directory`)); continue; }
    printLines(r.node.read());
  }
}, { usage: '<file>' });

def('tree', 'nav', 'show directory tree', args => {
  const r = resolve(args.find(a => !a.startsWith('-')));
  const all = args.includes('-a');
  if (r.error || r.node.type !== 'dir') return print(span('e', 'tree: invalid directory'));
  print(span('h b', r.segs.length ? r.segs.at(-1) : '~'));
  let dirs = 0, files = 0;
  const walk = (node, prefix, segs) => {
    const ents = Object.entries(node.children).filter(([n]) => all || !n.startsWith('.'));
    ents.forEach(([n, child], i) => {
      const last = i === ents.length - 1;
      print(span('m', prefix + (last ? '└── ' : '├── ')) + lsEntry(n, child, segs));
      if (child.type === 'dir') { dirs++; walk(child, prefix + (last ? '    ' : '│   '), [...segs, n]); } else files++;
    });
  };
  walk(r.node, '', r.segs);
  print('', ''); print(span('m', `${dirs} directories, ${files} files`));
}, { usage: '[-a] [dir]' });

      h2('SEE ALSO'), `       ${cmd('about', 'about(1)')}, ${cmd('experience', 'experience(1)')}, ${cmd('contact', 'contact(1)')}`, '',
      span('m', 'IanOS 2026                       October 2026                       IAN(1)'),
    ]);
  }
  const c = C[t];
  if (!c || !c.group) return print(`No manual entry for ${esc(t)}`);
  printLines([h2('NAME'), `       ${esc(c.name)} - ${esc(c.desc)}`, h2('SYNOPSIS'), `       ${esc(c.name)}${c.usage ? ' ' + esc(c.usage) : ''}`,
    ...(c.aliases.length ? [h2('ALIASES'), '       ' + esc(c.aliases.join(', '))] : [])]);
}, { usage: '<command>' });

// ---- visuals ----
function figlet(text) {
  const G = {
    i:[' _ ','(_)','| |','| |','|_|'],
    a:['       ','  __ _ ',' / _` |','| (_| |',' \\__,_|'],
    n:['       ',' _ __  ',"| '_ \\ ",'| | | |','|_| |_|'],
    t:[' _   ','| |_ ','| __|','| |_ ',' \\__|'],
    e:['      ','  ___ ',' / _ \\','|  __/',' \\___|'],
    m:['           ',' _ __ ___  ',"| '_ ` _ \\ ",'| | | | | |','|_| |_| |_|'],
    ' ':['  ','  ','  ','  ','  '],
  };
  return [0,1,2,3,4].map(r => [...text].map(ch => G[ch][r]).join('')).join('\n');
}
function charsPerLine() {
  const probe = document.createElement('span'); probe.textContent = 'x'.repeat(50);
  probe.style.visibility = 'hidden'; out.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 50; probe.remove();
  return Math.floor((term.clientWidth - 40) / w);
}
function banner() {
  if (charsPerLine() >= 66) print(esc(figlet('ian tiemann')), 'banner');
  else print(span('banner', '» ian tiemann'));
  print(span('m', 'Project engineer · IT · development · project management'));
}
function uptime() {
  const s = Math.floor((Date.now() - BOOT_TIME) / 1000);
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h ? `${h}h ${m % 60}m` : m ? `${m} min` : `${s} sec`;
}
function neofetch() {

    '  ___________  ',

// ---- input ----
let hist = store.get('hist', []), hIdx = hist.length, busy = false;

function tokenize(s) {
  const out = []; let cur = '', q = null;
  for (const ch of s) {
    if (q) { if (ch === q) q = null; else cur += ch; }
    else if (ch === '"' || ch === "'") q = ch;
    else if (/\s/.test(ch)) { if (cur) { out.push(cur); cur = ''; } }
    else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}


async function run(raw, { echo = true } = {}) {
  raw = raw.trim();
  if (echo) print(promptHTML() + esc(raw));
  if (!raw) return;
  if (raw === '!!') { if (!hist.length) return; raw = hist[hist.length - 1]; print(span('m', raw)); }
  if (hist[hist.length - 1] !== raw) { hist.push(raw); hist = hist.slice(-200); store.set('hist', hist); }
  hIdx = hist.length;

  const [name, ...args] = tokenize(raw);
  const c = C[name.toLowerCase()];
  if (!c) {
    const visible = Object.values(C).filter(x => x.group && !x.alias).map(x => x.name);
    const best = visible.map(n => [n, lev(name.toLowerCase(), n)]).sort((a, b) => a[1] - b[1])[0];
    print(span('e', `command not found: ${esc(name)}`) + (best && best[1] <= 2 ? span('m', ' - did you mean ') + cmd(best[0]) + span('m', '?') : span('m', ' - type ') + cmd('help')));
    return;
  }
  busy = true; cancelled = false; inrow.style.visibility = 'hidden';
  try { await c.run(args, raw); }
  catch (e) { if (e.message === 'SIGINT') { print(span('e', '^C')); } else { print(span('e', 'error: ' + esc(e.message))); console.error(e); } }
  finally { busy = false; inrow.style.visibility = ''; renderPrompt(); scrollDown(); focusInput(); }
}

// tab completion, pressing tab again cycles through the matches
let cycle = null;
function complete(back = false) {
  if (cycle && kb.value === cycle.current) {
    const n = cycle.opts.length;
    cycle.idx = cycle.idx < 0 ? (back ? n - 1 : 0) : (cycle.idx + (back ? -1 : 1) + n) % n;
    const o = cycle.opts[cycle.idx];
    kb.value = cycle.current = cycle.head + o + (o.endsWith('/') ? '' : cycle.suffix);
    cycle.items.forEach((el, i) => el.classList.toggle('sel', i === cycle.idx));
    moveEnd();
    return;
  }
  cycle = null;
  const val = kb.value, parts = val.split(/\s+/);
  if (parts.length === 1) {
    const opts = Object.values(C).filter(c => c.group && !c.alias).map(c => c.name).filter(n => n.startsWith(parts[0]));
    return applyCompletion(val, parts[0], opts, ' ');
  }
  const word = parts.at(-1);
  const slash = word.lastIndexOf('/');
  const dirPart = slash >= 0 ? word.slice(0, slash + 1) : '';
  const base = word.slice(slash + 1);
  const r = resolve(dirPart || '.');
  if (r.error || r.node.type !== 'dir') return;
  const opts = Object.entries(r.node.children)
    .filter(([n]) => n.startsWith(base) && (base.startsWith('.') || !n.startsWith('.')))
    .map(([n, node]) => dirPart + n + (node.type === 'dir' ? '/' : ''));
  applyCompletion(val, word, opts, '');
}
function applyCompletion(val, word, opts, suffix) {
  if (!opts.length) return;
  opts = [...new Set(opts)].sort((a, b) => a.localeCompare(b));
  const head = val.slice(0, val.length - word.length);
  if (opts.length === 1) { kb.value = head + opts[0] + (opts[0].endsWith('/') ? '' : suffix); return; }
  let pre = opts[0];
  for (const o of opts) while (!o.startsWith(pre)) pre = pre.slice(0, -1);
  if (pre.length > word.length) kb.value = head + pre;
  print(promptHTML() + esc(kb.value));
  const label = o => o.slice(o.lastIndexOf('/', o.length - 2) + 1);
  const list = print(opts.map(o => `<span class="opt">${esc(label(o))}</span>`).join('  '));
  cycle = { opts, head, suffix, idx: -1, current: kb.value, items: [...list.querySelectorAll('.opt')] };
}

kb.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = kb.value; kb.value = ''; run(v); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { if (hIdx > 0) { kb.value = hist[--hIdx]; } e.preventDefault(); moveEnd(); }
  else if (e.key === 'ArrowDown') { if (hIdx < hist.length - 1) kb.value = hist[++hIdx]; else { hIdx = hist.length; kb.value = ''; } e.preventDefault(); }
  else if (e.key === 'Tab') { e.preventDefault(); complete(e.shiftKey); }
  else if (cycle && !['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) cycle = null;
  else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; }
  else if (e.ctrlKey && e.key.toLowerCase() === 'c' && !getSelection().toString()) { e.preventDefault(); print(promptHTML() + esc(kb.value) + span('e', '^C')); kb.value = ''; }
});
const moveEnd = () => requestAnimationFrame(() => kb.setSelectionRange(kb.value.length, kb.value.length));

addEventListener('keydown', e => {
  if (busy && e.ctrlKey && e.key.toLowerCase() === 'c') { cancelled = true; e.preventDefault(); }
});


function focusInput() { if (!busy && !getSelection().toString()) kb.focus({ preventScroll: true }); }




term.addEventListener('click', e => {
  const a = e.target.closest('a[data-cmd]');
  if (a) { e.preventDefault(); if (!busy) run(a.dataset.cmd); return; }
  if (!e.target.closest('a')) focusInput();
});

// ---- boot ----
async function boot(reboot = false) {
  out.innerHTML = ''; cwd = []; renderPrompt();
  busy = true; inrow.style.visibility = 'hidden';
  const fast = !reboot && store.get('visited', false);
  const lines = [
    '[  OK  ] Started coffee.service',
    '[  OK  ] Mounted /home/guest/experience',
    '[  OK  ] Reached target curiosity.target',
    '[  OK  ] Started terminal.iantiemann.nl',
  ];
  try {
    if (!fast) for (const l of lines) { print(l.replace('OK', span('a', 'OK')).replace(/^\[/, span('m','[')).replace(/^(<span class="m">\[<\/span>.*?)\]/, '$1' + span('m',']'))); await sleep(110); }
  } catch {}
  if (!fast) print('');
  banner();
  print('');
  print(`Welcome! Type ${cmd('help')} or click one of the commands to get started.`);
  print(`Try: ${cmd('about')}  ${cmd('experience')}  ${cmd('projects')}  ${cmd('articles')}  ${cmd('skills')}  ${cmd('contact')}  ${cmd('ls')}`);
  print('');
  store.set('visited', true);
  busy = false; inrow.style.visibility = ''; renderPrompt(); focusInput();
}

document.body.dataset.theme = store.get('theme', 'default');
if (store.get('crt', false)) document.body.classList.add('crt');
boot().then(() => {
  refreshFeed();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) { run(h.replace(/[-_+]/g, ' ')); }
});
})();
