<!--
  Hi there, source reader. 👋

  Yes, every achievement, the treasure hunt and the incident are all in the
  source. The full list with solutions sits in js/achievements.js.

  But it's way more fun to find them by trying things. Poke around the terminal,
  type the commands you'd use on a real Linux box, read the files, and use
  `hint` when you're stuck. The solutions will still be here if you give up.

  Reading the answers in here is like skipping to the last page of a murder
  mystery. Fine, I'll spoil that one for free: it was DNS.

  Curious how it's built instead? https://github.com/iantmn/terminal-website
-->
